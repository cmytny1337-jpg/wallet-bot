<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Кошелёк</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b12;
    --bg-soft:#12131e;
    --surface:#171827;
    --text:#f3f4f9;
    --text-dim:#888ba3;
    --text-faint:#585a70;
    --violet:#6e5cf5;
    --cyan:#31d8e8;
    --positive:#37d99b;
    --negative:#fb7189;
    --divider:rgba(255,255,255,0.07);
    --radius-lg:22px;
    --radius-md:14px;
    --safe-top:env(safe-area-inset-top, 0px);
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope', -apple-system, sans-serif;
    overscroll-behavior:none;
  }

  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    position:relative;
    overflow:hidden;
  }

  .screen{
    position:absolute;
    inset:0;
    padding:calc(20px + var(--safe-top)) 20px calc(28px + var(--safe-bottom));
    display:flex;
    flex-direction:column;
    transform:translateX(100%);
    transition:transform .32s cubic-bezier(.4,0,.2,1);
    background:var(--bg);
    overflow-y:auto;
  }
  .screen.active{ transform:translateX(0); }
  .screen.home{ transform:translateX(0); z-index:1; }
  .screen.home.behind{ transform:translateX(-24%); filter:brightness(.6); }

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px;
  }
  .topbar-title{ font-size:15px; font-weight:700; color:var(--text-dim); letter-spacing:.2px; }
  .icon-btn{
    width:36px; height:36px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface); border:none; color:var(--text-dim);
    cursor:pointer;
  }
  .icon-btn svg{ width:18px; height:18px; }
  .back-row{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .back-row h1{ font-size:20px; font-weight:800; margin:0; }

  /* ---------- Balance card ---------- */
  .balance-card{
    position:relative;
    border-radius:var(--radius-lg);
    padding:26px 24px 24px;
    background:linear-gradient(155deg, #15162a 0%, #0e0f1c 65%);
    border:1px solid rgba(255,255,255,0.06);
    overflow:hidden;
    margin-bottom:24px;
  }
  .balance-card::before{
    content:'';
    position:absolute;
    width:260px; height:260px;
    right:-90px; top:-120px;
    background:radial-gradient(circle at center, var(--violet) 0%, transparent 68%);
    opacity:.55;
    filter:blur(10px);
    animation:pulse 6s ease-in-out infinite;
  }
  .balance-card::after{
    content:'';
    position:absolute;
    width:200px; height:200px;
    left:-70px; bottom:-110px;
    background:radial-gradient(circle at center, var(--cyan) 0%, transparent 70%);
    opacity:.28;
    filter:blur(14px);
  }
  @keyframes pulse{
    0%,100%{ opacity:.5; transform:scale(1); }
    50%{ opacity:.7; transform:scale(1.08); }
  }
  .balance-label{
    position:relative; z-index:1;
    font-size:13px; font-weight:600; color:var(--text-dim);
    margin-bottom:10px;
  }
  .balance-amount{
    position:relative; z-index:1;
    font-family:'JetBrains Mono', monospace;
    font-size:40px; font-weight:700;
    letter-spacing:-1px;
    font-variant-numeric:tabular-nums;
    background:linear-gradient(90deg, #ffffff 0%, #cfd0ff 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .balance-user{
    position:relative; z-index:1;
    font-size:13px; color:var(--text-faint); margin-top:8px; font-weight:600;
  }

  /* ---------- Action row ---------- */
  .actions{
    display:flex; justify-content:space-between;
    margin-bottom:30px;
  }
  .action{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:8px;
    background:none; border:none; color:var(--text);
    cursor:pointer; padding:6px;
  }
  .action .circle{
    width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--surface);
    border:1px solid rgba(255,255,255,0.06);
    transition:transform .15s ease, background .15s ease;
  }
  .action:active .circle{ transform:scale(0.92); background:#1d1f31; }
  .action .circle svg{ width:20px; height:20px; stroke:var(--text); }
  .action span{ font-size:12px; font-weight:600; color:var(--text-dim); }

  /* ---------- History ---------- */
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .section-head h2{ font-size:15px; font-weight:700; margin:0; }
  .refresh-btn{
    background:none; border:none; color:var(--text-faint);
    display:flex; align-items:center; justify-content:center;
    width:30px; height:30px; cursor:pointer;
  }
  .refresh-btn svg{ width:16px; height:16px; }
  .refresh-btn.spin svg{ animation:spin .6s linear; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .tx-list{ display:flex; flex-direction:column; }
  .tx-row{
    display:flex; align-items:center; gap:12px;
    padding:13px 0;
    border-bottom:1px solid var(--divider);
  }
  .tx-row:last-child{ border-bottom:none; }
  .tx-dot{
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .tx-dot.in{ background:rgba(55,217,155,.13); }
  .tx-dot.out{ background:rgba(255,255,255,.06); }
  .tx-dot svg{ width:16px; height:16px; }
  .tx-dot.in svg{ stroke:var(--positive); }
  .tx-dot.out svg{ stroke:var(--text-dim); }
  .tx-main{ flex:1; min-width:0; }
  .tx-title{ font-size:14px; font-weight:700; }
  .tx-sub{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  .tx-amount{ font-family:'JetBrains Mono', monospace; font-size:14px; font-weight:600; white-space:nowrap; }
  .tx-amount.in{ color:var(--positive); }
  .tx-amount.out{ color:var(--text); }

  .empty{
    text-align:center; padding:40px 10px; color:var(--text-faint); font-size:13px;
  }

  /* ---------- Forms ---------- */
  .field{ margin-bottom:18px; }
  .field label{
    display:block; font-size:12px; font-weight:700; color:var(--text-dim);
    margin-bottom:8px;
  }
  .field .input-wrap{
    background:var(--surface);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:var(--radius-md);
    display:flex; align-items:center;
    padding:0 14px;
    transition:border-color .15s ease;
  }
  .field .input-wrap:focus-within{ border-color:var(--violet); }
  .field .input-wrap span.prefix{ color:var(--text-faint); font-weight:600; margin-right:2px; }
  .field input{
    flex:1; background:none; border:none; outline:none;
    color:var(--text); font-family:'Manrope', sans-serif;
    font-size:15px; font-weight:600; padding:14px 0;
  }
  .field input.amount{ font-family:'JetBrains Mono', monospace; font-size:20px; }
  .field input::placeholder{ color:var(--text-faint); font-weight:500; }

  .chips{ display:flex; gap:8px; margin-top:10px; }
  .chip{
    flex:1; padding:9px 0; border-radius:10px; text-align:center;
    background:var(--surface); border:1px solid rgba(255,255,255,0.06);
    color:var(--text-dim); font-size:12px; font-weight:700; cursor:pointer;
  }
  .chip:active{ background:#1d1f31; }

  .primary-btn{
    margin-top:auto;
    border:none; border-radius:var(--radius-md);
    padding:16px;
    font-family:'Manrope', sans-serif; font-size:15px; font-weight:800;
    color:#fff;
    background:linear-gradient(90deg, var(--violet), #8a6cf7);
    cursor:pointer;
  }
  .primary-btn:disabled{ opacity:.4; }
  .primary-btn:active:not(:disabled){ transform:scale(.98); }

  .error-banner{
    background:rgba(251,113,137,.12);
    border:1px solid rgba(251,113,137,.3);
    color:var(--negative);
    font-size:13px; font-weight:600;
    padding:12px 14px; border-radius:12px;
    margin-bottom:16px;
    display:none;
  }
  .error-banner.show{ display:block; }

  /* ---------- Receive screen ---------- */
  .receive-box{
    background:var(--surface);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:var(--radius-lg);
    padding:26px 20px;
    text-align:center;
  }
  .receive-box .tag{ font-size:12px; color:var(--text-dim); font-weight:700; margin-bottom:10px; }
  .receive-box .handle{
    font-family:'JetBrains Mono', monospace; font-size:24px; font-weight:700;
    color:var(--text); margin-bottom:20px; word-break:break-all;
  }
  .copy-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:linear-gradient(90deg, var(--violet), #8a6cf7);
    color:#fff; border:none; border-radius:12px;
    padding:11px 20px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .copy-btn svg{ width:15px; height:15px; }
  .hint{
    margin-top:22px; font-size:13px; color:var(--text-faint); line-height:1.5;
  }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:calc(24px + var(--safe-bottom));
    transform:translate(-50%, 20px);
    background:#1c1d2c; color:var(--text);
    border:1px solid rgba(255,255,255,0.08);
    padding:12px 18px; border-radius:12px;
    font-size:13px; font-weight:600;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:50; max-width:80%; text-align:center;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }

  .loading-dim{ opacity:.4; pointer-events:none; }
</style>
</head>
<body>

<div id="app">

  <!-- ==================== HOME ==================== -->
  <div class="screen home active" id="screen-home">
    <div class="topbar">
      <div class="topbar-title">Кошелёк</div>
      <button class="icon-btn" id="btn-refresh-top" aria-label="Обновить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>

    <div class="balance-card">
      <div class="balance-label">Баланс</div>
      <div class="balance-amount" id="balance-amount">$0.00</div>
      <div class="balance-user" id="balance-user">@—</div>
    </div>

    <div class="actions">
      <button class="action" id="btn-goto-send">
        <span class="circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></span>
        <span>Отправить</span>
      </button>
      <button class="action" id="btn-goto-receive">
        <span class="circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17"/><path d="M16 17H7V8"/></svg></span>
        <span>Получить</span>
      </button>
      <button class="action" id="btn-goto-history">
        <span class="circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>
        <span>История</span>
      </button>
    </div>

    <div class="section-head">
      <h2>Последние операции</h2>
      <button class="refresh-btn" id="btn-refresh-list" aria-label="Обновить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>
    <div class="tx-list" id="tx-list-preview"></div>
  </div>

  <!-- ==================== SEND ==================== -->
  <div class="screen" id="screen-send">
    <div class="back-row">
      <button class="icon-btn" data-back>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1>Отправить</h1>
    </div>

    <div class="error-banner" id="send-error"></div>

    <div class="field">
      <label>Кому</label>
      <div class="input-wrap">
        <span class="prefix">@</span>
        <input type="text" id="input-username" placeholder="username" autocomplete="off" autocapitalize="off">
      </div>
    </div>

    <div class="field">
      <label>Сумма</label>
      <div class="input-wrap">
        <span class="prefix">$</span>
        <input type="text" inputmode="decimal" class="amount" id="input-amount" placeholder="0.00">
      </div>
      <div class="chips">
        <div class="chip" data-pct="0.25">25%</div>
        <div class="chip" data-pct="0.5">50%</div>
        <div class="chip" data-pct="1">Макс</div>
      </div>
    </div>

    <button class="primary-btn" id="btn-send-confirm" disabled>Отправить</button>
  </div>

  <!-- ==================== RECEIVE ==================== -->
  <div class="screen" id="screen-receive">
    <div class="back-row">
      <button class="icon-btn" data-back>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1>Получить</h1>
    </div>

    <div class="receive-box">
      <div class="tag">Ваш юзернейм</div>
      <div class="handle" id="receive-handle">@—</div>
      <button class="copy-btn" id="btn-copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        Копировать
      </button>
    </div>
    <div class="hint">Отправьте этот юзернейм тому, кто хочет перевести вам средства. Он должен написать этому боту /start хотя бы один раз.</div>
  </div>

  <!-- ==================== HISTORY ==================== -->
  <div class="screen" id="screen-history">
    <div class="back-row">
      <button class="icon-btn" data-back>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <h1>История</h1>
    </div>
    <div class="tx-list" id="tx-list-full"></div>
  </div>

</div>

<div id="toast"></div>

<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  var initData = tg ? tg.initData : '';
  var MOCK = !initData;

  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#0a0b12'); tg.setBackgroundColor('#0a0b12'); } catch(e){}
  }

  var state = { balance: 0, username: '', history: [] };

  var screens = {
    home: document.getElementById('screen-home'),
    send: document.getElementById('screen-send'),
    receive: document.getElementById('screen-receive'),
    history: document.getElementById('screen-history')
  };

  function showScreen(name){
    Object.keys(screens).forEach(function(key){
      if (key === 'home') return;
      screens[key].classList.toggle('active', key === name);
    });
    screens.home.classList.toggle('behind', name !== 'home');

    if (tg && tg.BackButton) {
      if (name === 'home') { tg.BackButton.hide(); }
      else { tg.BackButton.show(); }
    }
  }

  if (tg && tg.BackButton) {
    tg.BackButton.onClick(function(){ showScreen('home'); });
  }

  document.querySelectorAll('[data-back]').forEach(function(btn){
    btn.addEventListener('click', function(){ showScreen('home'); });
  });
  document.getElementById('btn-goto-send').addEventListener('click', function(){
    document.getElementById('send-error').classList.remove('show');
    showScreen('send');
  });
  document.getElementById('btn-goto-receive').addEventListener('click', function(){ showScreen('receive'); });
  document.getElementById('btn-goto-history').addEventListener('click', function(){ renderHistory(true); showScreen('history'); });

  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove('show'); }, 2400);
  }

  function money(n){
    var v = Number(n) || 0;
    return '$' + v.toFixed(2);
  }

  function formatDate(raw){
    if (!raw) return '';
    var d = new Date(raw.replace(' ', 'T'));
    if (isNaN(d.getTime())) return raw;
    var now = new Date();
    var sameDay = d.toDateString() === now.toDateString();
    var yest = new Date(now); yest.setDate(now.getDate() - 1);
    var isYest = d.toDateString() === yest.toDateString();
    var hh = String(d.getHours()).padStart(2,'0');
    var mm = String(d.getMinutes()).padStart(2,'0');
    if (sameDay) return 'сегодня, ' + hh + ':' + mm;
    if (isYest) return 'вчера, ' + hh + ':' + mm;
    return d.toLocaleDateString('ru-RU') + ', ' + hh + ':' + mm;
  }

  function txRow(t){
    var isIn = t.direction === 'in';
    var row = document.createElement('div');
    row.className = 'tx-row';
    row.innerHTML =
      '<div class="tx-dot ' + (isIn ? 'in' : 'out') + '">' +
        (isIn
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17"/><path d="M16 17H7V8"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>') +
      '</div>' +
      '<div class="tx-main">' +
        '<div class="tx-title">' + (isIn ? 'Получено' : 'Отправлено') + '</div>' +
        '<div class="tx-sub">@' + escapeHtml(t.counterparty || '—') + ' · ' + formatDate(t.created_at) + '</div>' +
      '</div>' +
      '<div class="tx-amount ' + (isIn ? 'in' : 'out') + '">' + (isIn ? '+' : '−') + money(Math.abs(t.amount)).slice(1) + '</div>';
    return row;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function renderList(container, items, limit){
    container.innerHTML = '';
    var list = limit ? items.slice(0, limit) : items;
    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = 'Операций пока нет';
      container.appendChild(empty);
      return;
    }
    list.forEach(function(t){ container.appendChild(txRow(t)); });
  }

  function renderHome(){
    document.getElementById('balance-amount').textContent = money(state.balance);
    document.getElementById('balance-user').textContent = '@' + (state.username || '—');
    document.getElementById('receive-handle').textContent = '@' + (state.username || '—');
    renderList(document.getElementById('tx-list-preview'), state.history, 5);
  }

  function renderHistory(){
    renderList(document.getElementById('tx-list-full'), state.history, null);
  }

  function apiUrl(path){
    var q = 'initData=' + encodeURIComponent(initData);
    return path + (path.indexOf('?') >= 0 ? '&' : '?') + q;
  }

  function loadAll(spinning){
    if (MOCK) {
      state.username = 'you';
      state.balance = 128.5;
      state.history = [
        { amount: 25, direction: 'in', counterparty: 'alex', created_at: new Date().toISOString() },
        { amount: 10, direction: 'out', counterparty: 'friend', created_at: new Date(Date.now()-86400000).toISOString() },
        { amount: 50, direction: 'in', counterparty: 'maria', created_at: new Date(Date.now()-2*86400000).toISOString() }
      ];
      renderHome();
      return Promise.resolve();
    }

    var refreshTop = document.getElementById('btn-refresh-top');
    var refreshList = document.getElementById('btn-refresh-list');
    if (spinning) { refreshTop.classList.add('spin'); refreshList.classList.add('spin'); }

    return Promise.all([
      fetch(apiUrl('/api/me')).then(function(r){ return r.json(); }),
      fetch(apiUrl('/api/history')).then(function(r){ return r.json(); })
    ]).then(function(res){
      var me = res[0], hist = res[1];
      if (me.error) throw new Error(me.error);
      state.username = me.username;
      state.balance = me.balance;
      state.history = (hist.history || []);
      renderHome();
    }).catch(function(err){
      toast('Не удалось загрузить данные');
    }).finally(function(){
      setTimeout(function(){
        refreshTop.classList.remove('spin'); refreshList.classList.remove('spin');
      }, 400);
    });
  }

  document.getElementById('btn-refresh-top').addEventListener('click', function(){ loadAll(true); });
  document.getElementById('btn-refresh-list').addEventListener('click', function(){ loadAll(true); });

  // ---------- Copy username ----------
  document.getElementById('btn-copy').addEventListener('click', function(){
    var text = '@' + (state.username || '');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){
        toast('Скопировано');
        if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      }).catch(function(){ toast('Не удалось скопировать'); });
    }
  });

  // ---------- Send form ----------
  var inputUsername = document.getElementById('input-username');
  var inputAmount = document.getElementById('input-amount');
  var sendBtn = document.getElementById('btn-send-confirm');
  var sendError = document.getElementById('send-error');

  function validateSend(){
    var u = inputUsername.value.trim();
    var a = parseFloat(inputAmount.value.replace(',', '.'));
    sendBtn.disabled = !(u.length > 0 && !isNaN(a) && a > 0);
  }
  inputUsername.addEventListener('input', validateSend);
  inputAmount.addEventListener('input', function(){
    this.value = this.value.replace(',', '.').replace(/[^0-9.]/g, '');
    validateSend();
  });

  document.querySelectorAll('.chip').forEach(function(chip){
    chip.addEventListener('click', function(){
      var pct = parseFloat(chip.getAttribute('data-pct'));
      inputAmount.value = (state.balance * pct).toFixed(2);
      validateSend();
    });
  });

  sendBtn.addEventListener('click', function(){
    sendError.classList.remove('show');
    var to = inputUsername.value.trim().replace('@','');
    var amount = parseFloat(inputAmount.value.replace(',', '.'));

    if (MOCK) { toast('Откройте кошелёк внутри Telegram, чтобы отправлять'); return; }

    sendBtn.disabled = true;
    sendBtn.textContent = 'Отправка…';

    fetch('/api/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: initData, to: to, amount: amount })
    }).then(function(r){ return r.json(); }).then(function(res){
      if (!res.ok) {
        sendError.textContent = res.error || 'Не удалось выполнить перевод';
        sendError.classList.add('show');
        return;
      }
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      toast('Отправлено @' + to);
      inputUsername.value = '';
      inputAmount.value = '';
      showScreen('home');
      loadAll(false);
    }).catch(function(){
      sendError.textContent = 'Ошибка сети. Попробуйте ещё раз.';
      sendError.classList.add('show');
    }).finally(function(){
      sendBtn.textContent = 'Отправить';
      validateSend();
    });
  });

  loadAll(false);
})();
</script>

</body>
</html>
